<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="kc-coupon-slot" data-dynamic-variant-content="template--22740107133017__main-kc-coupon">
        <div class="kc-cp" data-kc-code="MAX20">
            <div class="kc-cp__stub"><span class="kc-cp__amt">$20</span><span class="kc-cp__off">OFF</span></div>
            <div class="kc-cp__main">
                <p class="kc-cp__l1"><span class="kc-pre">Extra <b>$20 off</b></span><span class="kc-post"><b>$20
                            off</b> claimed</span></p>
                <p class="kc-cp__l2"><span class="kc-pre">Code <b class="kc-cp__code">MAX20</b> · applied at
                        checkout</span><span class="kc-post">Applied automatically at checkout</span></p>
            </div>
            <a class="kc-cp__btn"
                href="/discount/MAX20?redirect=%2Fproducts%2Fkeychron-q1-max-qmk-via-wireless-custom-mechanical-keyboard%3Fvariant%3D40707102769241"
                rel="nofollow"><span class="kc-pre">Claim</span><span class="kc-post">✓ Claimed</span></a>
        </div>
    </div>
    <style>
        :root {
            --text-color: 42, 43, 42;
            --body-font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --body-font-size: 16;
            --body-font-style: normal;
            --body-font-weight: 400;
        }

        body {
            color: rgb(var(--text-color));
            font-family: var(--body-font-family);
            font-size: calc(var(--body-font-size) * .1rem);
            font-style: var(--body-font-style);
            font-weight: var(--body-font-weight);
            line-height: 1.5;
        }
    </style>
    <style>
        .kc-coupon-slot {
            container-type: inline-size
        }

        .kc-cp {
            --nx: 86px;
            --tint: #fff2eb;
            --stub: #ff7b4b;
            --ink: #2a2b2a;
            display: grid;
            grid-template-columns: var(--nx) 1fr auto;
            align-items: center;
            background: var(--tint);
            border-radius: 14px;
            margin: 14px 0 4px;
            color: var(--ink);
            -webkit-mask: radial-gradient(circle 8px at var(--nx) 0, #0000 96%, #000) top/100% 51% no-repeat, radial-gradient(circle 8px at var(--nx) 100%, #0000 96%, #000) bottom/100% 51% no-repeat;
            mask: radial-gradient(circle 8px at var(--nx) 0, #0000 96%, #000) top/100% 51% no-repeat, radial-gradient(circle 8px at var(--nx) 100%, #0000 96%, #000) bottom/100% 51% no-repeat
        }

        .kc-cp p {
            margin: 0
        }

        .kc-cp__stub {
            align-self: stretch;
            background: var(--stub);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 14px 0;
            border-radius: 14px 0 0 14px;
            border-right: 2px dashed rgba(255, 255, 255, .6)
        }

        .kc-cp__amt {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -.02em
        }

        .kc-cp__off {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .24em;
            padding-left: .24em;
            margin-top: 6px
        }

        .kc-cp__main {
            padding: 13px 14px 13px 18px;
            min-width: 0
        }

        .kc-cp__l1 {
            font-size: 16px
        }

        .kc-cp__l2 {
            font-size: 12.5px;
            color: #6b6c6b;
            margin-top: 2px !important
        }

        .kc-cp__code {
            color: var(--ink);
            letter-spacing: .06em
        }

        .kc-cp__btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            padding: 0 22px;
            margin-right: 14px;
            border-radius: 999px;
            background: var(--stub);
            color: #fff;
            border: 1.5px solid var(--stub);
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            text-decoration: none
        }

        .kc-cp__btn:hover {
            filter: brightness(.94)
        }

        .kc-cp .kc-post {
            display: none
        }

        .kc-cp.is-claimed .kc-pre {
            display: none
        }

        .kc-cp.is-claimed .kc-post {
            display: inline
        }

        .kc-cp.is-claimed .kc-cp__btn {
            background: transparent;
            color: #237a45;
            border-color: #237a45;
            pointer-events: none
        }

        @container (max-width:440px) {
            .kc-cp {
                --nx: 74px;
                grid-template-columns: var(--nx) 1fr
            }

            .kc-cp__stub {
                grid-row: 1 / span 2
            }

            .kc-cp__amt {
                font-size: 21px
            }

            .kc-cp__main {
                padding: 12px 12px 8px 16px
            }

            .kc-cp__btn {
                grid-column: 2;
                margin: 0 12px 12px 16px;
                height: 42px
            }
        }
    </style>
</body>

</html>
